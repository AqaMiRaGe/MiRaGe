name: download
on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: chat
        required: true
      mode:
        description: video, audio, search, shorts, identify
        required: false
        default: video
      url:
        required: false
        default: ""
      query:
        required: false
        default: ""
      file_id:
        required: false
        default: ""
      reply_to:
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        env:
          MODE: ${{ inputs.mode }}
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg) > /dev/null 2>&1 &
          EXTRA=""
          if [ "$MODE" = "identify" ]; then EXTRA="shazamio"; fi
          pip install -q -U "yt-dlp[default]" $EXTRA
          wait

      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MODE: ${{ inputs.mode }}
          URL: ${{ inputs.url }}
          QUERY: ${{ inputs.query }}
          FILE_ID: ${{ inputs.file_id }}
          REPLY_TO: ${{ inputs.reply_to }}
        run: |
          case "$CHAT_ID" in ''|*[!0-9-]*) exit 1 ;; esac
          W=$(pwd)
          API="https://api.telegram.org/bot$BOT_TOKEN"
          RT=()
          if [ -n "$REPLY_TO" ]; then
            RT=(--form-string "reply_to_message_id=$REPLY_TO" --form-string "allow_sending_without_reply=true")
          fi

          say() {
            curl -s "$API/sendMessage" -F "chat_id=$CHAT_ID" --form-string "text=$1" "${RT[@]}" > /dev/null < /dev/null
          }

          dl_video() {
            yt-dlp -S "res:480,ext:mp4:m4a" --merge-output-format mp4 --max-filesize 49M \
              --windows-filenames --playlist-end 5 -o "%(title).80s.%(ext)s" "$1" || true
          }
          dl_audio() {
            yt-dlp -x --audio-format mp3 --audio-quality 0 --max-filesize 49M \
              --windows-filenames --playlist-end 5 -o "%(title).80s.%(ext)s" "$1" || true
          }

          send_files() {
            ls | head -n 5 | while read -r f; do
              if [ "$(stat -c%s "$f")" -gt 52428800 ]; then
                say
